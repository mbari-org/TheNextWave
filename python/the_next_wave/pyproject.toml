[project]
name = "the-next-wave"
version = "0.1.0"
description = "Deterministic ocean wave prediction from sparse buoy data. This methodology and codes generate phase-resolved reconstructions of ocean waves over short time-space scales using measurements of wave motion collected by sparse arrays of Surface Wave Instrument Floats w/ Tracking (SWIFTs)"
readme = "README.md"
license = { text = "CC0-1.0" }
maintainers = [{ name = "anderson", email = "anderson@mbari.org" }]

# NOTE: "requires-python" is usually located here, but a workaround for a known ROS 2 bug:
#
#           https://github.com/colcon/colcon-python-setup-py/issues/33
#
#       requires this to be commented out. uv will complain with a warning, but you may ignore it as
#       the ".python-version" file tells it which python version to use.
#requires-python = ">=3.10"

dependencies = [
    "matplotlib>=3.10.8",
    "pooch>=1.9.0",
    "pyarrow>=23.0.0",
    "setuptools>=82.0.0",
    "tqdm>=4.67.3",
    "utm>=0.8.1",
    # Desktop Linux (x86_64 / Ubuntu 24.04)
    "netcdf4>=1.7.4; platform_machine == 'x86_64'",
    "numpy>=2.4.2; platform_machine == 'x86_64'",
    "pandas>=3.0.0; platform_machine == 'x86_64'",
    "scipy>=1.17.0; platform_machine == 'x86_64'",
    "xarray>=2026.1.0; platform_machine == 'x86_64'",
    # Jetson AGX Orin (aarch64 / JetPack / Ubuntu 22.04)
    "netcdf4>=1.7.3; platform_machine == 'aarch64'",
    "numpy>=2.2.6; platform_machine == 'aarch64'",
    "pandas>=2.3.3; platform_machine == 'aarch64'",
    "scipy>=1.15.3; platform_machine == 'aarch64'",
    "xarray>=2025.6.1; platform_machine == 'aarch64'",
]

[project.optional-dependencies]
jax = [
    # Desktop Linux + hosted CUDA 13 packages
    "jax[cuda13]>=0.9.1; sys_platform == 'linux' and platform_machine == 'x86_64'",

    # Jetson AGX Orin / aarch64 Linux
    "jax==0.6.2; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "jaxlib==0.6.2.dev20260407; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "jax-cuda12-plugin==0.6.2.dev20260407; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "jax-cuda12-pjrt==0.6.2.dev20260407; sys_platform == 'linux' and platform_machine == 'aarch64'",

    # Only when you opt into the JAX backend
    "jaxopt>=0.8.5; sys_platform == 'linux'",
]

[project.scripts]
the_next_wave_example = "the_next_wave.example:main"
the_next_wave_example_study = "the_next_wave.example_study:main"
the_next_wave_example_loo = "the_next_wave.example_loo:main"
the_next_wave_node = "the_next_wave.the_next_wave_node:main"
the_next_wave_sim_node = "the_next_wave.the_next_wave_node:main"
the_next_wave_plotter_node = "the_next_wave.the_next_wave_plotter_node:main"
the_next_wave_sbg_tcp_replay_node = "the_next_wave.sbg_tcp_replay_node:main"

[[tool.uv.index]]
name = "orin-jax"
url = "https://andermi.github.io/jax-orin-wheels/simple/"
explicit = true

[tool.uv.sources]
jaxlib = [
    { index = "orin-jax", extra = "jax", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
jax-cuda12-plugin = [
    { index = "orin-jax", extra = "jax", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
jax-cuda12-pjrt = [
    { index = "orin-jax", extra = "jax", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.dependency-metadata]]
name = "jax"
version = "0.6.2"
requires-dist = [
    "jaxlib==0.6.2.dev20260407; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "ml_dtypes>=0.5.0",
    "numpy>=1.26",
    "opt_einsum",
    "scipy>=1.12",
]
