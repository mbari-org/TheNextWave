# Config to be used in deployment with real SWIFTs and the physical MBARI WEC power buoy
/**:
  ros__parameters:
    # Deployment: swifts.* values are TCP ports, matching the port mapping from docs.
    swifts:
      swift22: 3003
      swift23: 3004
      swift24: 3001
      swift25: 3002  # 3005 if spoofing

/the_next_wave_node:
  ros__parameters:
    processing_interval_sec: 0.5
    # Raw SBG heave on real SWIFT is upside-down; apply correction.
    flip_z_sign: true
    # Matches MATLAB GenericCoordinateTransform convention (rotation=180 → x=+East, y=+North).
    rotation_deg: 180.0
    downsample_to_hz: 5.0
    wavespec_update_period_sec: 3600.0
    dense_prediction_window: 50.0
    wec_actual_history_sec: 50.0

    # Bulk diagnostic payloads, off in deployment: serializing them dominated
    # the publish step (~33k floats per message, ~1.6 s). All are recoverable in
    # post by replaying the raw SBG logs through the same ingest and solve:
    #   measurements   -> raw SBG + window_start_time/window_end_time (still sent)
    #   reconstruction -> P1 @ A from the replayed solve
    #   buoy_predictions -> replay; forecast_skill scalars are still published live
    #   wec_series     -> logged elsewhere
    # Turn these back on for any run you intend to export to CSV.
    publish_measurements: false
    publish_reconstruction: false
    publish_buoy_predictions: false
    publish_wec_series: false

    # solve swifts feed the inversion; verification swift is held out entirely and used
    # only to score forecasts. It influences neither the solve nor the averaged
    # wavespec, so its genuinely leave-one-out
    solve_swifts: ['swift22', 'swift23', 'swift24']
    verification_swift: 'swift25'

    # Score forecasts at every buoy once their timestamps are measured.
    # forecast_skill pools all of them; forecast_skill_by_buoy keeps them
    # separate, and verification_buoy_index points at swift25 -- the only
    # entry whose residual is out of sample.
    forecast_skill_enable: true
    forecast_skill_lead_sec: 4.0
    forecast_skill_window_sec: 140.0

    # Least-squares solver tuning
    lsq_max_iter: 60
    lsq_solver_backend: auto  # auto | jax | scipy
    lsq_diagnostics_enable: true
    lsq_near_bound_ratio: 0.95

    # Optional MEM stabilization (disabled by default; diverges from MATLAB).
    mem_moment_cap_enable: false
    mem_moment_cap: 0.999

    # In production, mbari wec target lat/lon should come from the AHRS topic.
    # Keep example frame override off unless intentionally running without AHRS.
    sbg_bridge_use_example_frame: false
    sbg_bridge_bind: 0.0.0.0
    sbg_bridge_swift_warm_start_us: 45000000

    # Note on SBG stream handling: reads are blocking and buffered, with no
    # read timeout. A vanished peer is detected by TCP keepalive (~30 s), which
    # is the only mechanism that tells "SWIFT alive but between hourly bursts"
    # apart from "SWIFT gone" -- silence alone cannot, given the ~20 min
    # inter-burst gap. A read timeout was rejected because it can fire
    # mid-message and corrupt the buffered reader, which is likely in the water
    # where links drop mid-message.

/the_next_wave_plotter_node:
  ros__parameters:
    prediction_topic: wave_predictions
    max_points: 600
    history_sec: 50.0
    figure_width_in: 16.0
    figure_height_in: 10.0

/sbg_tcp_replay_swift22:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift23:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift24:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift25:
  ros__parameters:
    host: 127.0.0.1
