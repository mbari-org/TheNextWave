# Config to be used in deployment with real SWIFTs and the physical MBARI WEC power buoy
/**:
  ros__parameters:
    # Deployment: swifts.* values are TCP ports, matching the port mapping from docs.
    swifts:
      swift22: 3003
      swift23: 3004
      swift24: 3001
      swift25: 3002  # 3005 if spoofing

/the_next_wave_node:
  ros__parameters:
    processing_interval_sec: 0.5
    # Window ends at the newest instant all solve buoys have data for, so a
    # trailing buoy pulls the window back rather than being dropped. This caps
    # how far behind that window may sit before solving is skipped; replayed
    # backfill is contiguous and valid but can be stale.
    window_max_lag_sec: 10.0
    # Raw SBG heave on real SWIFT is upside-down; apply correction.
    flip_z_sign: true

    # How buoy samples are combined into the solver matrix.
    #   nearest: intersect every buoy onto the first buoy's time grid, keeping
    #            only instants where all buoys agree within ~half a sample, and
    #            give every buoy that shared grid. Live SBG clocks disagree by
    #            more than that, so this can discard most of the window.
    #   index:   MATLAB (run_LS_prediction_SWIFTS.m). Same trailing sample
    #            count from each buoy, each keeping its own timestamps; the
    #            solver's phase term -t*omega already handles the offsets, so
    #            nothing is dropped and only the sample count has to match.
    align_mode: index

    # Conditioning of the velocity rows before the solve (heave untouched).
    #   none:   raw u/v from GpsVel.
    #   matlab: detrend(filtfilt(butter(5, 0.5), u)) -- order 5, cutoff at half
    #           Nyquist (1.25 Hz at 5 Hz), matching filtdat.m + run_LS.
    solver_input_filter: matlab
    # Matches MATLAB GenericCoordinateTransform convention (rotation=180 → x=+East, y=+North).
    rotation_deg: 180.0
    downsample_to_hz: 5.0
    wavespec_update_period_sec: 3600.0
    dense_prediction_window: 50.0
    wec_actual_history_sec: 50.0

    # Bulk diagnostic payloads, off in deployment: serializing them dominated
    # the publish step (~33k floats per message, ~1.6 s). All are recoverable in
    # post by replaying the raw SBG logs through the same ingest and solve:
    #   measurements   -> raw SBG + window_start_time/window_end_time (still sent)
    #   reconstruction -> P1 @ A from the replayed solve
    #   buoy_predictions -> replay; forecast_skill scalars are still published live
    #   wec_series     -> logged elsewhere
    # Turn these back on for any run you intend to export to CSV.
    publish_measurements: true
    publish_reconstruction: true
    publish_buoy_predictions: true
    publish_wec_series: false

    # solve swifts feed the inversion; verification swift is held out entirely and used
    # only to score forecasts. It influences neither the solve nor the averaged
    # wavespec, so its genuinely leave-one-out
    solve_swifts: ['swift22', 'swift23', 'swift24']
    verification_swift: ''  # 'swift25'

    # Score forecasts at every buoy once their timestamps are measured.
    # forecast_skill pools all of them; forecast_skill_by_buoy keeps them
    # separate, and verification_buoy_index points at swift25 -- the only
    # entry whose residual is out of sample.
    forecast_skill_enable: true
    forecast_skill_lead_sec: 1.0
    forecast_skill_window_sec: 140.0

    # Least-squares solver tuning
    lsq_max_iter: 60
    lsq_solver_backend: jax  # auto | jax | scipy
    lsq_diagnostics_enable: true
    lsq_near_bound_ratio: 0.95

    # Optional MEM stabilization (disabled by default; diverges from MATLAB).
    mem_moment_cap_enable: false
    mem_moment_cap: 0.999

    # Origin of the local x/y frame every coordinate in /wave_predictions is
    # measured from. Leave both out to latch it from the first solve SWIFT's
    # first GPS fix, which moves the frame between runs; set it to compare x/y
    # across runs, and required if any prediction point is given in x/y.
    lat_origin: 36.77182
    lon_origin: -121.86564

    # Extra forecast locations beside the WEC. Evaluated from the same solved
    # model at the same lead times, so each costs one matvec and no extra solve.
    # Parallel arrays: ROS parameters have no list-of-dict type. Left out
    # entirely rather than set to [], which the ROS yaml parser cannot type.
    prediction_points:
      latlon_names: ['constellation_centroid', 'swift25_centroid']
      lats: [36.77182, 36.77226]
      lons: [-121.86564, -121.86638]
    #   xy_names: ['grid_ne']
    #   xs: [250.0]
    #   ys: [250.0]

    # In production, mbari wec target lat/lon should come from the AHRS topic.
    # Keep example frame override off unless intentionally running without AHRS.
    sbg_bridge_use_example_frame: false
    sbg_bridge_bind: 0.0.0.0
    sbg_bridge_swift_warm_start_us: 45000000

    # SBG stream reads are blocking and buffered, with no read timeout. A
    # vanished peer is detected by TCP keepalive (~30 s), which distinguishes
    # "SWIFT alive but between hourly bursts" from "SWIFT gone"; silence alone
    # cannot, given the ~20 min inter-burst gap.

/the_next_wave_plotter_node:
  ros__parameters:
    prediction_topic: wave_predictions
    max_points: 600
    history_sec: 50.0
    figure_width_in: 16.0
    figure_height_in: 10.0

/sbg_tcp_replay_swift22:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift23:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift24:
  ros__parameters:
    host: 127.0.0.1

/sbg_tcp_replay_swift25:
  ros__parameters:
    host: 127.0.0.1
