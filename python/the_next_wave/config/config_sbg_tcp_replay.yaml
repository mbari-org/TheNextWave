# Config for simulating predictions with real SWIFT buoy data replayed over TCP from .mat data
/**:
  ros__parameters:
    # TCP bridge mode: swifts.* values are TCP ports, matching the port mapping from docs.
    swifts:
      swift22: 3003
      swift23: 3004
      swift24: 3001
      swift25: 3002

/the_next_wave_node:
  ros__parameters:
    processing_interval_sec: 0.5
    # Raw SBG heave on real SWIFT is upside-down; apply correction.
    flip_z_sign: true
    # Matches MATLAB GenericCoordinateTransform convention (rotation=180 → x=+East, y=+North).
    rotation_deg: 180.0
    # downsample_to_hz: 5.0
    wavespec_update_period_sec: 300.0
    dense_prediction_window: 50.0
    wec_actual_history_sec: 50.0
    # If true, evaluate dense model output on WEC actual-history timestamps (sim only).
    # enable_dense_history_projection: false

    # Least-squares solver tuning
    lsq_ridge: 1.0e-6  # overall MAP prior scale
                       # main effect is when use_spectrum_weighted_ridge is false
    lsq_max_iter: 5
    lsq_solver_backend: auto  # auto | jax | scipy
    lsq_use_spectrum_weighted_ridge: true
    lsq_spectrum_ridge_floor: 1.0e-6  # min per-component prior stddev (floor on ub); prevents
                                      # infinite regularization on near-zero-energy components
    lsq_diagnostics_enable: false
    lsq_near_bound_ratio: 0.95

    # Optional MEM stabilization (disabled by default; diverges from MATLAB).
    mem_moment_cap_enable: false
    mem_moment_cap: 0.999

    # Use example frame when running bridge+replay (no mbari wec AHRS topic)
    sbg_bridge_use_example_frame: true
    sbg_bridge_bind: 0.0.0.0
    example_latorigin: 41.6878
    example_lonorigin: -9.0545
    # Matches MATLAB GenericCoordinateTransform convention (rotation=180 → x=+East, y=+North).
    example_rotation_deg: 180.0
    example_xtarget: 200.0
    example_ytarget: 200.0

/the_next_wave_plotter_node:
  ros__parameters:
    prediction_topic: wave_predictions
    max_points: 600
    history_sec: 50.0
    figure_width_in: 16.0
    figure_height_in: 10.0

/sbg_tcp_replay_swift22:
  ros__parameters:
    host: spec

/sbg_tcp_replay_swift23:
  ros__parameters:
    host: spec

/sbg_tcp_replay_swift24:
  ros__parameters:
    host: spec

/sbg_tcp_replay_swift25:
  ros__parameters:
    host: spec
