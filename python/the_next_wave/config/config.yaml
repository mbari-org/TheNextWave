# Config for simulation with mbari_wec (gz sim)
/the_next_wave_node:
  ros__parameters:
    processing_interval_sec: 0.5
    # In gz sim, z is already up-positive. Do NOT apply the SWIFT SBG mount correction.
    flip_z_sign: false
    # Matches MATLAB GenericCoordinateTransform convention (rotation=180 → x=+East, y=+North).
    rotation_deg: 180.0
    downsample_to_hz: 5.0
    wavespec_update_period_sec: 300.0
    # Only compute/publish dense_predictions_* for the last N seconds of the
    # measurement window. Set to 0 to use the full window.
    dense_prediction_window: 50.0
    # If true, evaluate dense model output on WEC actual-history timestamps (sim only).
    enable_dense_history_projection: true
    # How much high-rate WEC actual history to package in each prediction message.
    wec_actual_history_sec: 50.0

    # Least-squares solver tuning
    lsq_max_iter: 60  # 60
    lsq_solver_backend: auto  # auto | jax | scipy
    lsq_diagnostics_enable: false
    lsq_near_bound_ratio: 0.95

    # Optional MEM stabilization (disabled by default; diverges from MATLAB).
    mem_moment_cap_enable: true
    mem_moment_cap: 0.999

    # Sim latent ingest noise floor (helps avoid MEM singularities on perfect waves).
    # Modes: 'none' | 'additive' | 'amplitude_scaling' | 'both'
    latent_noise_mode: none
    latent_noise_std_z_m: 1.0e-1  # 0.0  # 1.0e-6
    latent_noise_std_uv_mps: 1.0e-1  # 0.0  # 1.0e-6
    latent_noise_seed: 42
    # Per-buoy slowly varying multiplicative amplitude scaling (used when
    # latent_noise_mode is 'amplitude_scaling' or 'both').
    latent_scale_std_frac: 0.08
    latent_scale_tau_sec: 20.0
    latent_scale_min: 0.75
    latent_scale_max: 1.25

    # For SWIFT bridge + replay only
    sbg_bridge_use_example_frame: false

    # SWIFT buoy index mapping for latent_data incident wave height providing (u,v,eta). Matches the
    # order of points added to buoy_gazebo::IncWaveHeight plugin in:
    #     `mbari_wec_gz/buoy_description/models/mbari_wec_ros/model.sdf`.
    # NOTE: index 0 is reserved for the incident wave height at the `target` mbari wec buoy (used
    #       only for comparison with prediction -- not for computing prediction)
    swifts:
      swift22: 1
      swift23: 2
      swift24: 3
      swift25: 4

    wave_dir: 270.0  # 200.0
    swift_coords:
      x: [-125.0, -185.0, -100.0, 45.0]
      y: [-25.0, -115.0, -135.0, -175.0]
      # x: [-90.0, -37.0, -135.0, 8.0]
      # y: [-246.0, -103.0, -148.0, -201.0]

/the_next_wave_plotter_node:
  ros__parameters:
    prediction_topic: wave_predictions
    max_points: 600
    history_sec: 50.0
    figure_width_in: 16.0
    figure_height_in: 12.0